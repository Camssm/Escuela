services:

  eurekaserver:
    build:
      context: .
      dockerfile: ./registry/Dockerfile
    container_name: eurekaserver
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - escuela-network

  configserver:
    build:
      context: .
      dockerfile: ./springconfigserver/Dockerfile
    container_name: configserver
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eurekaserver:8761/eureka/
    depends_on:
      - eurekaserver
    networks:
      - escuela-network

  admin-service:
    build:
      context: .
      dockerfile: ./admin-service/Dockerfile
    container_name: admin-service
    ports:
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eurekaserver:8761/eureka/
    depends_on:
      - eurekaserver
      - configserver
    restart: on-failure
    networks:
      - escuela-network

  security-service:
    build:
      context: .
      dockerfile: ./security-service/Dockerfile
    container_name: security-service
    ports:
      - "8085:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eurekaserver:8761/eureka/
    depends_on:
      - eurekaserver
      - configserver
    restart: on-failure
    networks:
      - escuela-network

  ms-cursos:
    build:
      context: .
      dockerfile: ./Cursos/Dockerfile
    container_name: ms-cursos
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eurekaserver:8761/eureka/
      - SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS=true
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - eurekaserver
      - configserver
      - rabbitmq
    restart: on-failure
    networks:
      - escuela-network

  ms-alumnos:
    build:
      context: .
      dockerfile: ./Alumno/Dockerfile
    container_name: ms-alumnos
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eurekaserver:8761/eureka/
      - SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS=true
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - eurekaserver
      - configserver
      - rabbitmq
    restart: on-failure
    networks:
      - escuela-network

  ms-administracion:
    build:
      context: .
      dockerfile: ./Administracion/Dockerfile
    container_name: ms-administracion
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eurekaserver:8761/eureka/
      - SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS=true
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - eurekaserver
      - configserver
      - rabbitmq
    restart: on-failure
    networks:
      - escuela-network

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eurekaserver:8761/eureka/
    depends_on:
      - eurekaserver
      - configserver
      - ms-cursos
      - ms-alumnos
      - ms-administracion
      - security-service
    restart: on-failure
    networks:
      - escuela-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - escuela-network

networks:
  escuela-network:
    driver: bridge