server:
  port: 8081

spring:
  application:
    name: ms-cursos
  config:
    import: "configserver:http://localhost:8888" # Conexión al Config Server
  datasource:
    url: jdbc:h2:mem:cursodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ # Cambiado a localhost
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

# Configuración de Actuator para Spring Boot Admin
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always