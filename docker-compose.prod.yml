x-spring-cloud: &spring-cloud
  SPRING_PROFILES_ACTIVE: docker
  SPRING_CONFIG_IMPORT: "configserver:http://configserver:8888"
  SPRING_CLOUD_CONFIG_URI: "http://configserver:8888"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8761/eureka/"
  SPRING_RABBITMQ_HOST: rabbitmq

services:

  eurekaserver:
    build:
      context: .
      dockerfile: ./registry/Dockerfile
    container_name: eurekaserver
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - escuela-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8761"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s

  configserver:
    build:
      context: .
      dockerfile: ./springconfigserver/Dockerfile
    container_name: configserver
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
    depends_on:
      eurekaserver:
        condition: service_healthy
    networks:
      - escuela-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8888"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: escuelaRoot2026
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - escuela-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pescuelaRoot2026"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - escuela-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  admin-service:
    build:
      context: .
      dockerfile: ./admin-service/Dockerfile
    container_name: admin-service
    ports:
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
    depends_on:
      eurekaserver:
        condition: service_healthy
    restart: on-failure
    networks:
      - escuela-network

  security-service:
    build:
      context: .
      dockerfile: ./security-service/Dockerfile
    container_name: security-service
    ports:
      - "8085:8085"
    environment:
      <<: *spring-cloud
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: on-failure
    networks:
      - escuela-network

  ms-cursos:
    build:
      context: .
      dockerfile: ./Cursos/Dockerfile
    container_name: ms-cursos
    ports:
      - "8081:8081"
    environment:
      <<: *spring-cloud
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - escuela-network

  ms-alumnos:
    build:
      context: .
      dockerfile: ./Alumno/Dockerfile
    container_name: ms-alumnos
    ports:
      - "8082:8082"
    environment:
      <<: *spring-cloud
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - escuela-network

  ms-administracion:
    build:
      context: .
      dockerfile: ./Administracion/Dockerfile
    container_name: ms-administracion
    ports:
      - "8083:8083"
    environment:
      <<: *spring-cloud
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - escuela-network

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      <<: *spring-cloud
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      ms-cursos:
        condition: service_started
      ms-alumnos:
        condition: service_started
      ms-administracion:
        condition: service_started
      security-service:
        condition: service_started
    restart: on-failure
    networks:
      - escuela-network

volumes:
  mysql_data:

networks:
  escuela-network:
    driver: bridge
