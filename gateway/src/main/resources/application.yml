spring:
  application:
    name: gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

      routes:
        - id: cursos
          uri: lb://MS-CURSOS
          predicates:
            - Path=/api/cursos/**

        - id: alumnos
          uri: lb://MS-ALUMNOS
          predicates:
            - Path=/api/alumnos/**

        - id: administracion
          uri: lb://MS-ADMINISTRACION
          predicates:
            - Path=/api/Administracion/**

eureka:
  client:
    service-url:
      defaultZone: http://eurekaserver:8761/eureka/

server:
  port: 8080
