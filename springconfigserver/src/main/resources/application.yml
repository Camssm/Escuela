spring:
  application:
    name: configserver
  cloud:
    config:
      server:
        git:
          uri: https://github.com/maxi19/config-Server
          clone-on-start: true
          default-label: main
server:
  port: '8888'
---
spring:
  config:
    activate:
      on-profile: dev
eureka:
  client:
     service-url:
       defaultZone: http://localhost:8761/eureka/
---
spring:
  config:
    activate:
      on-profile: prod
eureka:
  client:
    service-url:
        defaultZone: http://eurekaserver:8761/eureka/
